[package]
name = "distributed"
version = "0.1.0"
edition = "2021"
description = "Kafka-backed distributed ledger variant"

[dependencies]
transaction_processor = { path = ".." }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = "0.4"
rskafka = { version = "0.6", default-features = false }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "mysql"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
